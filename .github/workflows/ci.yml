name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }} / numpy ${{ matrix.numpy }}${{ matrix.fortran == 'gfortran' && ' / gfortran' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The Windows mingw-gfortran corner (include below) is experimental:
    # flang + MSVC is the documented and supported Windows toolchain, so
    # that corner's failure must not block the matrix.
    continue-on-error: ${{ matrix.fortran == 'gfortran' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        numpy: ['1.26', '2']
        # Windows-only toolchain selector. The single-value 'flang'
        # dimension is REQUIRED for the gfortran include below to add a
        # NEW job: an include whose keys all match an existing matrix
        # combination merges into that job instead of creating one.
        fortran: ['flang']
        exclude:
          # numpy 1.26 has no Python 3.13 support (3.9-3.12 only)
          - python-version: '3.13'
            numpy: '1.26'
        include:
          # Experimental corners: build with the runner image's mingw
          # gfortran (gcc + gfortran, plain pip deps, no MSVC/micromamba),
          # mirroring the Windows flang cells one for one. Guards the
          # "pip install from sdist with mingw on PATH" user path while
          # no wheels are published. Still continue-on-error until the
          # recipe goes green end-to-end.
          - os: windows-latest
            python-version: '3.10'
            numpy: '1.26'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.10'
            numpy: '2'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.11'
            numpy: '1.26'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.11'
            numpy: '2'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.12'
            numpy: '1.26'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.12'
            numpy: '2'
            fortran: 'gfortran'
          - os: windows-latest
            python-version: '3.13'
            numpy: '2'
            fortran: 'gfortran'
    defaults:
      run:
        # login shell so the micromamba environment (Windows) is active
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4
        with:
          # upstream/ submodule: test fixtures and the optional bhmie_ref
          # reference build used by the slow equivalence tests
          submodules: recursive

      # --- Fortran toolchain: system gfortran on POSIX ------------------
      - name: Install gfortran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      # --- Fortran toolchain: conda-forge flang on Windows --------------
      # (also provides the job's python + numpy there)

      - name: Set up MSVC environment (Windows flang)
        if: runner.os == 'Windows' && matrix.fortran == 'flang'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up conda environment (Windows flang)
        if: runner.os == 'Windows' && matrix.fortran == 'flang'
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bhmiepy-ci
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ matrix.numpy == '1.26' && 'numpy=1.26.*' || 'numpy>=2,<3' }}
            meson-python
            ninja
            pytest
            pip
            flang
            flang-rt_win-64

      # --- Python environment on POSIX -----------------------------------
      - name: Set up Python
        if: runner.os != 'Windows' || matrix.fortran == 'gfortran'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test dependencies (gfortran)
        if: runner.os != 'Windows' || matrix.fortran == 'gfortran'
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.numpy }}" = "1.26" ]; then
            pip install "numpy==1.26.*"
          else
            pip install "numpy>=2,<3"
          fi
          pip install meson-python ninja pytest

      # --- Build and test -------------------------------------------------
      # Editable install keeps the build tree (with the optional bhmie_ref
      # executable) where the slow equivalence tests can find it. The
      # Windows flang tweaks mirror scripts/dev-install.cmd (see the
      # project CLAUDE.md "Development environment" section):
      #   CC/FC     - windows-latest ships an MSYS2 gcc/gfortran; pin the
      #               MSVC C compiler and the conda flang so meson cannot
      #               pick gfortran, which rejects -static-libflangrt in
      #               FFLAGS and breaks linker detection.
      #   AR/RANLIB - meson looks for "ar"/"gar"; the conda env only ships
      #               the llvm-* variants.
      #   LIB       - link.exe does not know where flang_rt.runtime lives.
      #   FFLAGS    - conda flang-rt ships no DLL: link the static runtime.

      - name: Build (Windows flang)
        if: runner.os == 'Windows' && matrix.fortran == 'flang'
        run: |
          export CC=cl
          export FC=flang-new
          # Git Bash's /usr/bin comes first in the login-shell PATH and
          # its coreutils link.exe shadows MSVC's linker; put the pinned
          # cl's directory first so meson finds the real link.exe next to
          # it. (The dev machine never sees this: dev-install.cmd runs
          # under cmd.exe + vcvarsall, where MSVC is already first.)
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          export AR=llvm-ar
          export RANLIB=llvm-ranlib
          export FFLAGS="-static-libflangrt"
          export LIB="$LIB;$(flang-new --print-resource-dir)/lib/x86_64-pc-windows-msvc"
          python -m pip install -e . --no-build-isolation

      - name: Build (gfortran)
        if: runner.os != 'Windows' || matrix.fortran == 'gfortran'
        run: |
          # Windows mingw corner only: pin the MSYS2 compilers and link
          # the Fortran runtime statically, so the built .pyd does not
          # depend on libgfortran DLLs absent from the user's PATH.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CC=gcc
            export FC=gfortran
            # Static-link the whole Fortran runtime: the .pyd must not
            # depend on libgfortran/libquadmath/libwinpthread DLLs that
            # only exist inside an MSYS2 installation. (-static-libgcc
            # alone leaves libwinpthread dynamic; the -Bstatic pair
            # wraps just that one library.)
            export FFLAGS="-static-libgfortran -static-libgcc"
            # NOTE 1: the -Wl,-Bstatic ... -Wl,-Bdynamic tokens MUST be
            # separate arguments -- nesting a -Wl inside a single
            # -Wl,... comma list passes a literal "-Wl" to ld and breaks
            # every link (cost us one CI round to find out).
            # NOTE 2: -static-libgfortran alone is NOT enough: meson
            # links the mixed C+Fortran extension with the gcc driver
            # and injects -lgfortran itself, which resolves to the
            # dynamic import lib -- so libgfortran must be wrapped in
            # our own -Bstatic block too (CPython >= 3.8 does not
            # resolve extension DLL deps from PATH, so any dynamic
            # Fortran runtime DLL makes the .pyd unloadable). The
            # dev-only bhmie_ref.exe still links libquadmath and
            # libwinpthread dynamically (gfortran appends them after
            # the wrap); that is fine -- it only ever runs where the
            # mingw toolchain is on PATH (CI, dev machines).
            export LDFLAGS="-static-libgfortran -static-libgcc -static-libquadmath -Wl,-Bstatic -lgfortran -lquadmath -lwinpthread -Wl,-Bdynamic"
            gfortran --version | head -n 1
            gcc --version | head -n 1
          fi
          python -m pip install -e . --no-build-isolation
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Surface any remaining DLL dependency here, in the build
            # step, instead of as an opaque test-time ImportError.
            # (ldd is not available in Git Bash; pe_imports.py is a
            # dependency-free PE import-table dumper.)
            python .github/scripts/pe_imports.py build/*/_bhmiepy_ext*.pyd || true
            python -c "import bhmiepy"
          fi

      - name: Fast test suite
        run: python -m pytest

      - name: Slow golden-data and upstream-equivalence tests
        run: python -m pytest -m slow
